    <style amp-custom>
      :root {
        --red: #8504fe;
        --dred: rgb(0, 22, 51);
        --text: rgba(255 1 1 / 84%, 0, 0.8);
        --fnt: "Rajdhani", sans-serif;
        --border-width: 2px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--fnt);
        background: #000000;
        color: #fff;
        min-height: 100vh;
        width: 100%;
        overflow: auto;
      }

      .hud-stage {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: url(https://i.postimg.cc/PdwbBGtk/bannertototogel3.png);
        background-repeat: no-repeat;
        background-size: cover;
      }

      .hud-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(18, 18, 10, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
          linear-gradient(
            90deg,
            rgba(255, 208, 0, 0.02),
            rgba(255, 196, 0, 0.01),
            rgba(255 0 0, 0.02)
          );
        background-size:
          100% 3px,
          3px 100%;
        z-index: 2;
        pointer-events: none;
      }

      .system-interface {
        position: relative;
        z-index: 20;
        width: 90%;
        margin: 10px 0;
        max-width: 400px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 0 30px rgba(255, 238, 0, 0.3);
        animation: system-boot 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        background: #8504fe;
        clip-path: polygon(
          0 30px,
          30px 0,
          100% 0,
          100% calc(100% - 30px),
          calc(100% - 30px) 100%,
          0 100%
        );
      }
      @keyframes system-boot {
        from {
          opacity: 0;
          transform: scale(1.1);
          filter: brightness(3);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: brightness(1);
        }
      }

      .system-interface::before {
        content: "";
        position: absolute;
        top: var(--border-width);
        left: var(--border-width);
        right: var(--border-width);
        bottom: var(--border-width);
        z-index: -1;
        background: rgb(0 0 0);
        box-shadow: inset 0 0 15px rgba(255 0 0, 0.15);
        clip-path: polygon(
          0 30px,
          30px 0,
          100% 0,
          100% calc(100% - 30px),
          calc(100% - 30px) 100%,
          0 100%
        );
      }

      .logo-shell {
        margin-bottom: 10px;
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .data-frame {
        width: 100%;
        margin-bottom: 5px;
        line-height: 0;
        position: relative;
        padding: 4px;
      }

      .data-frame::before {
        content: "";
        position: absolute;
        top: -4px;
        right: -4px;
        width: 12px;
        height: 12px;
        border-top: 2px solid #8504fe;
        border-right: 2px solid #8504fe;
        animation: clickframe 1s linear infinite;
      }

      .data-frame::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: -4px;
        width: 12px;
        height: 12px;
        border-bottom: 2px solid #8504fe;
        border-left: 2px solid #8504fe;
        animation: clickframe 1s linear infinite;
      }

      @keyframes clickframe {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .banner-container {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3px;
        box-sizing: border-box;
        overflow: hidden;
        border-radius: 10px;
        flex-shrink: 0;
        background: rgba(255, 208, 0, 0.2);
        box-shadow:
          0 0 20px rgba(0, 0, 0, 0.85),
          0 0 16px rgba(216, 197, 31, 0.2);
        transition:
          box-shadow 0.3s ease,
          transform 0.3s ease;
      }

      .banner-container::before,
      .banner-container::after {
        content: "";
        position: absolute;
        width: 150%;
        height: 150%;
        background: conic-gradient(
          transparent,
          transparent,
          transparent,
          #f2df33
        );
        animation: rotateGlow 4s linear infinite;
      }

      .banner-container::after {
        background: conic-gradient(
          transparent,
          transparent,
          transparent,
          #8504fe
        );
        animation-delay: -2s;
      }

      @keyframes rotateGlow {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .banner-content {
        position: relative;
        z-index: 4;
        width: 100%;
        height: 100%;
        background: #111111;
        border-radius: 8px;
        overflow: hidden;

      .diag-row {

      .full-diag-pod {

      .full-diag-pod::before {

        clip-path: polygon(
          0 0,
          15% 0,

          0 85%,
          1px 85%,
          1px calc(100% - 1px),
          15% calc(100% - 1px),
          15% 100%,
          0 100%,
          100% 100%,
          85% 100%,
          85% calc(100% - 1px),
          calc(100% - 1px) calc(100% - 1px),
          calc(100% - 1px) 85%,
          100% 85%,
          100% 15%,
          calc(100% - 1px) 15%,
          calc(100% - 1px) 1px,
          85% 1px,
          85% 0,
          100% 0
        );
        animation: diag-pulse 2s infinite alternate;
      }
      @keyframes diag-pulse {
        from {
          opacity: 0.3;
          filter: drop-shadow(0 0 2px #8504fe);

        to {

      .diag-meta {
